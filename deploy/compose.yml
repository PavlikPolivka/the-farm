# Lives at /opt/pixel-farm/compose.yml on the homelab.
services:
  pixel-farm:
    image: ghcr.io/pavlikpolivka/the-farm:latest
    container_name: pixel-farm
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "3000"
    # If Caddy runs on the host rather than in Docker, publish on loopback instead:
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks:
      - portal
    # Public resolvers, so a router DNS outage can't block logins (the server must reach
    # auth.ppolivka.com). Container names on `portal` still resolve through Docker.
    dns:
      - 1.1.1.1
      - 8.8.8.8

networks:
  portal:
    external: true
