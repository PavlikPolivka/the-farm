# The homelab tunnel is token-managed, so ingress lives in the Cloudflare dashboard:
#   Zero Trust → Networks → Tunnels → <tunnel> → Public Hostname → Add
#     Subdomain: farm   Domain: ppolivka.com
#     Service:   HTTP   URL: caddy:9097
# This also creates the DNS record. Equivalent config-file form, for reference:
ingress:
  - hostname: farm.ppolivka.com
    service: http://caddy:9097
