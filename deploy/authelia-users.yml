# Additions for Authelia's file user database (users_database.yml), if that is the backend.
# Hash passwords with:  docker run --rm -it authelia/authelia:latest authelia crypto hash generate argon2
# Pavel's existing user only needs the two groups added.
users:
  # pavel:
  #   groups: [..., 'pixel-farm', 'pixel-farm-admin']
  wife:                       # rename to the real username
    displayname: 'Mum'        # shown as the player name on first login; editable later by the admin
    password: '$argon2id$REPLACE'
    email: ''
    groups: ['pixel-farm']
  kid:                        # rename to the real username
    displayname: 'Kid'
    password: '$argon2id$REPLACE'
    email: ''
    groups: ['pixel-farm']
